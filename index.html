<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110F">
<meta name="color-scheme" content="dark">
<title>Escape Room</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="app"></div>
<noscript>Escape Room needs JavaScript.</noscript>
<script>
  try {
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
      // A new version took over (cache-first shell): on the menu reload once, so a returning player sees new
      // stories at once; in a room leave it, the next load picks it up. Not on the very first install.
      var hadController = !!navigator.serviceWorker.controller, reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController || reloaded || !document.querySelector('.menu')) return;
        reloaded = true; location.reload();
      });
    }
  } catch (e) { /* ignore */ }
</script>
<script>
  // Own install button: shown when Chrome offers installation (beforeinstallprompt).
  (function () {
    var deferred = null, btn = null;
    var nl = (navigator.language || '').slice(0, 2) === 'nl';
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault(); deferred = e;
      if (btn) btn.remove();
      btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'btn small';
      btn.textContent = nl ? 'Installeer app' : 'Install app';
      btn.style.cssText = 'position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50';
      btn.onclick = function () {
        var d = deferred; deferred = null; btn.remove();
        try { d.prompt(); } catch (err) { /* offered again on the next event */ }
      };
      document.body.appendChild(btn);
    });
    window.addEventListener('appinstalled', function () { if (btn) btn.remove(); });
  })();
</script>
<script>
// Chrome Android keeps a stale 100dvh after pull-to-refresh: size #app from the real inner height.
(function () {
  function fit() { document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px'); }
  fit();
  ['resize', 'orientationchange', 'pageshow', 'focus'].forEach(function (e) { window.addEventListener(e, fit); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  setTimeout(fit, 300);
})();
</script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
